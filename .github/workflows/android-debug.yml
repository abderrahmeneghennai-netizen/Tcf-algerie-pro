name: Build TCF Algerie Pro Android

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le projet
        uses: actions/checkout@v4

      - name: Vérifier le schéma SQLite V4
        run: python3 tests/sqlite_schema_test.py

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installer Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Installer les dependances
        run: npm install

      - name: Construire l'interface V4.0
        run: npm run build

      - name: Ajouter Android
        run: npx cap add android

      - name: Installer l'outil de génération d'icône
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      - name: Générer la nouvelle icône Android
        run: |
          mkdir -p android/app/src/main/res/drawable-nodpi
          mkdir -p android/app/src/main/res/mipmap-anydpi-v26
          for spec in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            density=${spec%%:*}
            size=${spec##*:}
            mkdir -p "android/app/src/main/res/mipmap-${density}"
            convert assets/android-icon.svg -background white -alpha remove -alpha off -resize "${size}x${size}" "android/app/src/main/res/mipmap-${density}/ic_launcher.png"
            cp "android/app/src/main/res/mipmap-${density}/ic_launcher.png" "android/app/src/main/res/mipmap-${density}/ic_launcher_round.png"
          done
          convert assets/android-icon.svg -background none -resize 432x432 -gravity center -extent 432x432 android/app/src/main/res/drawable-nodpi/ic_launcher_foreground.png
          cat > android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@android:color/white" />
              <foreground android:drawable="@drawable/ic_launcher_foreground" />
          </adaptive-icon>
          EOF
          cp android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml

      - name: Autoriser le microphone
        run: |
          sed -i '/<manifest/a\    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />' android/app/src/main/AndroidManifest.xml

      - name: Synchroniser Android
        run: npx cap sync android

      - name: Construire APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Publier APK
        uses: actions/upload-artifact@v4
        with:
          name: TCF-Algerie-Pro-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
