name: Build TCF Algerie Pro Android

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le projet
        uses: actions/checkout@v4

      - name: Vérifier le schéma SQLite V4
        run: python3 tests/sqlite_schema_test.py

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installer l'outil de génération d'icône
        run: sudo apt-get update && sudo apt-get install -y librsvg2-bin

      - name: Installer Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Installer les dependances
        run: npm install

      - name: Construire l'interface V4.0
        run: npm run build

      - name: Ajouter Android
        run: npx cap add android

      - name: Autoriser le microphone
        run: |
          sed -i '/<manifest/a\    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />' android/app/src/main/AndroidManifest.xml

      - name: Synchroniser Android
        run: npx cap sync android

      - name: Générer les icônes Android après synchronisation
        run: |
          mkdir -p android/app/src/main/res/mipmap-anydpi-v26
          for spec in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            density=${spec%%:*}
            size=${spec##*:}
            mkdir -p "android/app/src/main/res/mipmap-${density}"
            rsvg-convert --width "${size}" --height "${size}" assets/android-icon.svg --output "android/app/src/main/res/mipmap-${density}/ic_launcher.png"
            cp "android/app/src/main/res/mipmap-${density}/ic_launcher.png" "android/app/src/main/res/mipmap-${density}/ic_launcher_round.png"
          done
          mkdir -p android/app/src/main/res/drawable-nodpi
          rsvg-convert --width 432 --height 432 assets/android-icon-foreground.svg --output android/app/src/main/res/drawable-nodpi/ic_launcher_foreground.png
          test -s android/app/src/main/res/drawable-nodpi/ic_launcher_foreground.png
          test -s android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          ET.register_namespace("android", "http://schemas.android.com/apk/res/android")
          path = "android/app/src/main/AndroidManifest.xml"
          tree = ET.parse(path)
          root = tree.getroot()
          android = "{http://schemas.android.com/apk/res/android}"
          application = root.find("application")
          if application is None:
              raise SystemExit("Balise application introuvable dans AndroidManifest.xml")
          application.set(android + "icon", "@mipmap/ic_launcher")
          application.set(android + "roundIcon", "@mipmap/ic_launcher_round")
          tree.write(path, encoding="utf-8", xml_declaration=True)
          PY
          cat > android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@android:color/white" />
              <foreground android:drawable="@drawable/ic_launcher_foreground" />
          </adaptive-icon>
          EOF
          cp android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml

      - name: Construire APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Publier APK
        uses: actions/upload-artifact@v4
        with:
          name: TCF-Algerie-Pro-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
