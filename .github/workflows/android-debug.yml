name: Build TCF Algerie Pro Android

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le projet
        uses: actions/checkout@v4

      - name: Vérifier le schéma SQLite V4
        run: python3 tests/sqlite_schema_test.py

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installer les outils de génération et contrôle des icônes
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin
          python3 -m pip install --user pillow

      - name: Installer Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Installer les dependances
        run: npm install

      - name: Construire l'interface V4.0
        run: npm run build

      - name: Ajouter Android
        run: npx cap add android

      - name: Autoriser le microphone
        run: |
          sed -i '/<manifest/a\\    <uses-permission android:name="android.permission.RECORD_AUDIO" />\\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />' android/app/src/main/AndroidManifest.xml

      - name: Synchroniser Android
        run: npx cap sync android

      - name: Générer et contrôler les icônes Android
        run: |
          set -euo pipefail

          RES="android/app/src/main/res"

          # Utiliser des PNG classiques dans toutes les densités.
          # Cela évite le rendu adaptatif défectueux constaté sur certains lanceurs Samsung.
          for spec in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            density="${spec%%:*}"
            size="${spec##*:}"
            mkdir -p "$RES/mipmap-${density}"
            rsvg-convert --format png --width "$size" --height "$size" assets/android-icon.svg --output "$RES/mipmap-${density}/ic_launcher.png"
            cp "$RES/mipmap-${density}/ic_launcher.png" "$RES/mipmap-${density}/ic_launcher_round.png"
          done

          # Supprimer les définitions adaptatives : Android utilisera les PNG vérifiés.
          rm -f "$RES/mipmap-anydpi-v26/ic_launcher.xml" "$RES/mipmap-anydpi-v26/ic_launcher_round.xml"
          rm -f "$RES/drawable-nodpi/ic_launcher_foreground.png"

          # Déclarer explicitement les deux icônes dans le manifeste.
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          ET.register_namespace("android", "http://schemas.android.com/apk/res/android")
          path = "android/app/src/main/AndroidManifest.xml"
          tree = ET.parse(path)
          root = tree.getroot()
          android = "{http://schemas.android.com/apk/res/android}"
          application = root.find("application")
          if application is None:
              raise SystemExit("Balise application introuvable dans AndroidManifest.xml")
          application.set(android + "icon", "@mipmap/ic_launcher")
          application.set(android + "roundIcon", "@mipmap/ic_launcher_round")
          tree.write(path, encoding="utf-8", xml_declaration=True)
          PY

          # Vérifier que chaque PNG existe, est lisible, non vide et contient bien le logo.
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageChops
          root = Path("android/app/src/main/res")
          for density, size in [("mdpi",48),("hdpi",72),("xhdpi",96),("xxhdpi",144),("xxxhdpi",192)]:
              for filename in ["ic_launcher.png", "ic_launcher_round.png"]:
                  path = root / f"mipmap-{density}" / filename
                  if not path.is_file() or path.stat().st_size < 1000:
                      raise SystemExit(f"Icône absente ou trop petite : {path}")
                  with Image.open(path) as im:
                      im.load()
                      if im.size != (size, size):
                          raise SystemExit(f"Mauvaise dimension pour {path}: {im.size}")
                      rgb = im.convert("RGB")
                      if ImageChops.difference(rgb, Image.new("RGB", rgb.size, "white")).getbbox() is None:
                          raise SystemExit(f"Icône entièrement blanche : {path}")
              print(f"OK icônes {density}: {size}x{size}")
          PY

          grep -q 'android:icon="@mipmap/ic_launcher"' "$RES/../AndroidManifest.xml"
          grep -q 'android:roundIcon="@mipmap/ic_launcher_round"' "$RES/../AndroidManifest.xml"

      - name: Construire APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Publier APK
        uses: actions/upload-artifact@v4
        with:
          name: TCF-Algerie-Pro-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
